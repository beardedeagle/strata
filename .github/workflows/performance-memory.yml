name: Performance Memory Review

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Base ref to compare against when mounted worktrees are not provided.
        required: false
        default: main
      rss_runs:
        description: Fresh-process RSS comparison runs.
        required: false
        default: "30"
      cli_runs:
        description: Product CLI footprint comparison runs.
        required: false
        default: "20"

permissions:
  contents: read

jobs:
  memory-review:
    name: Fresh-process and CLI memory comparison
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Cache Cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-memory-registry-${{ hashFiles('Cargo.lock', 'fuzz/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-memory-registry-

      - name: Setup stable Rust and just
        uses: ./.github/actions/setup-rust
        with:
          toolchain: stable

      - name: Install Linux memory tools
        run: |
          set -euo pipefail

          if [[ -x /usr/bin/time ]]; then
            exit 0
          fi

          if command -v sudo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y time
          else
            apt-get update
            apt-get install -y time
          fi

      - name: Run memory comparison
        env:
          BASE_WORKTREE: ${{ env.STRATA_PERFORMANCE_BASE_WORKTREE }}
          CURRENT_WORKTREE: ${{ env.STRATA_PERFORMANCE_CURRENT_WORKTREE }}
          RSS_RUNS: ${{ env.STRATA_PERFORMANCE_RSS_RUNS }}
          CLI_RUNS: ${{ env.STRATA_PERFORMANCE_CLI_RUNS }}
          INPUT_BASE_REF: ${{ inputs.base_ref }}
          INPUT_RSS_RUNS: ${{ inputs.rss_runs }}
          INPUT_CLI_RUNS: ${{ inputs.cli_runs }}
        run: |
          set -euo pipefail

          base_worktree="${BASE_WORKTREE:-}"
          current_worktree="${CURRENT_WORKTREE:-}"
          rss_runs="${RSS_RUNS:-${INPUT_RSS_RUNS:-30}}"
          cli_runs="${CLI_RUNS:-${INPUT_CLI_RUNS:-20}}"

          if [[ -z "${base_worktree}" || -z "${current_worktree}" ]]; then
            base_worktree="${RUNNER_TEMP}/strata-memory-base"
            current_worktree="${GITHUB_WORKSPACE}"
            base_ref="${INPUT_BASE_REF:-main}"

            git -C "${current_worktree}" fetch --depth=1 origin "${base_ref}"
            git -C "${current_worktree}" worktree add --detach "${base_worktree}" FETCH_HEAD
          fi

          if [[ ! -f "${base_worktree}/Cargo.toml" || ! -f "${current_worktree}/Cargo.toml" ]]; then
            echo "Error: memory comparison requires base and current Strata worktrees" >&2
            echo "base=${base_worktree}" >&2
            echo "current=${current_worktree}" >&2
            exit 2
          fi

          bash "${current_worktree}/tools/performance-rss-compare.sh" \
            --runs "${rss_runs}" \
            "${base_worktree}" \
            "${current_worktree}"

          bash "${current_worktree}/tools/performance-cli-footprint-compare.sh" \
            --runs "${cli_runs}" \
            "${base_worktree}" \
            "${current_worktree}"
