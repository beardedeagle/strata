[book]
title = "Strata And Mantle"
description = "Documentation for Strata source programs and Mantle runtime artifacts."
src = "src"
language = "en"

[build]
build-dir = "book"
create-missing = false

[rust]
edition = "2024"

[output.html]
git-repository-url = "https://github.com/beardedeagle/strata"
# Held back from the first review push to keep large local docs runtime assets
# out of the initial PR. Re-enable with the matching files before merge.
# additional-js = ["theme/strata-highlight.js", "mermaid.min.js", "svg-pan-zoom.min.js", "mermaid-init.js"]
# additional-css = ["mermaid-zoom.css"]

[preprocessor.mermaid]
command = "mdbook-mermaid"

[output.html.fold]
enable = true
level = 0
